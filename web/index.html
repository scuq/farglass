<!doctype html>
<html lang="en" data-theme="lcars" data-accent="orange">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/src/brand/farglass.svg" />
    <title>farglass</title>
  </head>
  <body>
    <!-- The tints of the shell icons in the LCARS theme (F072). The CSS sets the flood colors: one for an icon, one for the icon of the active item (F075). -->
    <svg class="icon-tints" width="0" height="0" aria-hidden="true" focusable="false">
      <filter id="icon-tint" color-interpolation-filters="sRGB">
        <feFlood class="icon-tint-color" />
        <feComposite in2="SourceAlpha" operator="in" />
      </filter>
      <filter id="icon-tint-active" color-interpolation-filters="sRGB">
        <feFlood class="icon-tint-active-color" />
        <feComposite in2="SourceAlpha" operator="in" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
