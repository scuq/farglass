[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/scuq/farglass"

[workspace.dependencies]
farglass-proto = { path = "crates/farglass-proto" }
arc-swap = "1.9.5"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "ws"] }
bytes = "1.12"
clap = { version = "4.6.8", features = ["derive", "env"] }
clap_complete = "4.6.12"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
farglass-session = { path = "crates/farglass-session" }
farglass-login = { path = "crates/farglass-login" }
farglass-surface = { path = "crates/farglass-surface" }
http-body-util = "0.1.5"
nix = { version = "0.32", default-features = false, features = ["user"] }
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h3-webtransport = "0.1.2"
http = "1"
hyper = { version = "1.12", features = ["http1", "http2", "server"] }
libc = "0.2.191"
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server-auto", "service", "tokio"] }
proptest = "1.12"
pty-process = { version = "0.5.4", features = ["async"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "xwayland"] }
wayland-client = "0.31.15"
x11rb = { version = "0.13.2", default-features = false, features = ["xtest"] }
wayland-protocols = { version = "0.32.13", features = ["client"] }
lz4_flex = { version = "0.14.2", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
jpeg-encoder = "0.7.1"
openh264 = "0.9.10"
opus1 = "0.3.0"
base64 = "0.23.1"
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
webauthn-rs = "0.6.2"
tempfile = "3.27"
url = "2.5.9"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.2"
toml_edit = "0.25.19"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
x509-parser = "0.18.1"
zbus = { version = "6.3", default-features = false, features = ["tokio", "proxy", "service"] }
zeroize = { version = "1.9.2", features = ["serde"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
