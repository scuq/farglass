[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scuq/farglass"

[workspace.dependencies]
farglass-proto = { path = "crates/farglass-proto" }
arc-swap = "1.9.5"
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio", "ws"] }
bytes = "1.12"
clap = { version = "4.6.8", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
farglass-session = { path = "crates/farglass-session" }
http-body-util = "0.1.5"
nix = { version = "0.32", default-features = false, features = ["user"] }
hyper = { version = "1.12", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "http2", "server-auto", "service", "tokio"] }
proptest = "1.12"
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7.20", features = ["codec"] }
toml = "1.2"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
x509-parser = "0.18.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
