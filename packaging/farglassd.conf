# farglassd.conf - the configuration of farglassd
#
# The format is TOML.
# Each option shows its default value, or an example if it has no default.
# To change an option, remove the number sign and set the value.
# The command-line options and the environment variables of farglassd
# override this file. See `farglassd --help`.

# The address and the port that farglassd listens on.
#listen = "[::]:8443"

# The directory with the shell files.
#web_root = "/usr/share/farglass/web"

# The directory for the files that farglassd writes.
#state_dir = "/var/lib/farglass"

# The Unix socket that the session agents connect to.
# Each user can connect. The uid of the agent selects its browser connections.
#agent_socket = "/run/farglass/agent.sock"

# The Unix socket of farglass-login, which does the PAM login.
#login_socket = "/run/farglass/login.sock"

# More origins that farglassd accepts for the WebSocket and the session cookie.
# farglassd always accepts the origin https://HOST, where HOST is the host in the request.
# For the Vite development server, add "http://localhost:5173".
#allowed_origins = ["http://localhost:5173"]

# CAUTION: Do not set this option on a host that other persons can use.
# Each browser connection becomes this user with no login.
# The option is for development only. farglassd refuses it unless `listen`
# is a loopback address. The value is a username or a numeric uid.
#dev_user = "alice"

[tls]
# The certificate of the server.
#
# With no `cert` and no `key`, farglassd makes a self-signed certificate in
# `state_dir`/tls. The certificate is valid for 30 days. farglassd makes a
# new one before the old one expires.
#
# To use your own certificate, set `cert` and `key`.
# `cert` is a PEM file with the certificate chain, the server certificate first.
# `key` is a PEM file with the private key (PKCS #8, PKCS #1, or SEC 1).
# The user of farglassd must be able to read the two files.
# farglassd loads changed files again in less than one hour, or immediately
# after SIGHUP: `systemctl reload farglassd` or `pkill -HUP farglassd`.
#cert = "/etc/farglass/tls/fullchain.pem"
#key = "/etc/farglass/tls/privkey.pem"

# More names and addresses for the self-signed certificate.
# It always has the hostname, `localhost`, 127.0.0.1, and ::1.
#names = ["desk.cyberdyne.example", "192.0.2.10"]
