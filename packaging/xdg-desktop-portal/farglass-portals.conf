# The desktop portals of a farglass web session (XDG_CURRENT_DESKTOP=farglass).
#
# The GTK backend works with each Wayland compositor: its dialogs, for example
# the file chooser, show as windows in the shell. The GNOME backend needs GNOME
# Shell, which a web session does not have. The secrets come from the keyring.
[preferred]
default=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
