# release.yml - build, sign, and publish a farglass release (F066, ADR-047, ADR-048)
#
# Trigger: a tag vX.Y.Z, or workflow_dispatch AT such a tag:
#
#   gh workflow run release.yml --ref vX.Y.Z
#
# Run it at the tag, never at a branch. cosign keyless records the ref of the
# run in its certificate, and farglassctl accepts only
# .github/workflows/release.yml@refs/tags/v*. The guard in `meta` stops a run
# from a branch before it builds anything.
#
# One release has, for amd64 and arm64:
#   farglass-VERSION-linux-ARCH.tar.gz   the host programs, the web files, units, PAM files
#   farglassctl-linux-ARCH               the static manager
#   farglass-client-X.Y.Z-linux-ARCH.AppImage, .deb, and .rpm   the desktop client (F121, F123)
# and SHA256SUMS with its cosign bundle SHA256SUMS.sigstore.json.
#
# The host programs are built in a Rocky Linux 9 container: glibc 2.34 is the
# oldest glibc of the supported distributions, thus the programs run on all.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          set -eu
          case "${GITHUB_REF}" in
            refs/tags/v[0-9]*) ;;
            *) echo "::error::A release must run at a v tag, not ${GITHUB_REF}. Use: gh workflow run release.yml --ref vX.Y.Z"; exit 1 ;;
          esac
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

  web:
    needs: meta
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  host:
    needs: [meta, web]
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: rockylinux:9
    timeout-minutes: 60
    steps:
      - name: Install the build tools and libraries
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y gcc gcc-c++ binutils libstdc++-static clang cmake nasm make perl git tar gzip file \
            findutils pam-devel pipewire-devel libxkbcommon-devel pkgconf-pkg-config
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
      # Do not write to GITHUB_PATH here. The rockylinux:9 image sets no PATH,
      # and the runner then starts each later step with only the added
      # directory in PATH: "sh" is not found.
      - name: Install the toolchain of rust-toolchain.toml
        run: |
          . "$HOME/.cargo/env"
          rustup toolchain install
      - name: Build the host programs and the tarball
        run: |
          . "$HOME/.cargo/env"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/release.sh host "${{ needs.meta.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: host-${{ matrix.runner }}
          path: dist/*
          retention-days: 1

  farglassctl:
    needs: meta
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools file
      - name: Build the static farglassctl
        run: |
          rustup toolchain install
          rustup target add "$(uname -m)-unknown-linux-musl"
          packaging/release.sh ctl "${{ needs.meta.outputs.version }}" dist
          dist/farglassctl-linux-* version
      - uses: actions/upload-artifact@v4
        with:
          name: ctl-${{ matrix.runner }}
          path: dist/*
          retention-days: 1

  # The desktop client gets the version of the tag, also if client/package.json has a different one.
  client:
    needs: meta
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - run: npm --prefix client ci
      - run: npm --prefix client test
      - name: Build the AppImage, the deb package, and the rpm package
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          npm --prefix client version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npm --prefix client run dist
          # electron-builder calls amd64 "x64", and the rpm "x86_64" or "aarch64".
          # The release files say amd64 and arm64, as the other files.
          for f in client/release/farglass-client-*-linux-*; do
            to=$(echo "$f" | sed -E 's/-linux-(x64|x86_64)\./-linux-amd64./; s/-linux-aarch64\./-linux-arm64./')
            if [ "$f" != "$to" ]; then mv "$f" "$to"; fi
          done
          ls -l client/release/farglass-client-*
      - uses: actions/upload-artifact@v4
        with:
          name: client-${{ matrix.runner }}
          path: |
            client/release/farglass-client-*.AppImage
            client/release/farglass-client-*.deb
            client/release/farglass-client-*.rpm
          retention-days: 1

  # The packages of the desktop client must install, and the client must find its libraries.
  client-smoke:
    needs: [client]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ["debian:12", "ubuntu:24.04", "fedora:44", "almalinux:10"]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-${{ matrix.runner }}
          path: dist
      - name: Install the package
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y ./dist/farglass-client-*.deb
          else
            dnf install -y ./dist/farglass-client-*.rpm
          fi
      - name: Find the libraries
        run: |
          set -eu
          if ldd /opt/farglass/farglass-client | grep "not found"; then exit 1; fi
          test -x /usr/bin/farglass-client

  # The programs must find their libraries and start on the oldest supported release of each distribution.
  smoke:
    needs: [host]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        image: ["debian:12", "ubuntu:24.04", "rockylinux:9", "fedora:44"]
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: host-${{ matrix.runner }}
          path: dist
      - name: Install the runtime libraries
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update && apt-get install -y --no-install-recommends libpam0g libpipewire-0.3-0 libxkbcommon0
          else
            dnf install -y pam pipewire-libs libxkbcommon tar gzip
          fi
      - name: Start the programs
        run: |
          set -eu
          tar -xzf dist/farglass-*.tar.gz -C dist
          cd dist/farglass-*/bin
          if ldd farglassd farglass-login farglass-session | grep "not found"; then exit 1; fi
          ./farglassd --version
          ./farglass-login --version

  release:
    needs: [meta, host, farglassctl, client, client-smoke, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      # The notes are the section of this version in CHANGELOG.md.
      # A tag with no section publishes nothing.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -eu
          awk -v version="$VERSION" '/^## /{ on = ($2 == version); next } on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section '## $VERSION'. Cut the release with the release skill."
            exit 1
          fi
          {
            echo
            echo "Install: download farglassctl-linux-ARCH, then run: \`sudo ./farglassctl-linux-ARCH install --user YOURNAME\`"
            echo
            echo "Desktop client for Linux: farglass-client-${VERSION#v}-linux-ARCH.AppImage, .deb, or .rpm"
          } >> notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          set -eu
          mkdir dist
          mv artifacts/farglass-*.tar.gz artifacts/farglassctl-linux-* artifacts/farglass-client-* dist/
          cd dist && sha256sum farglass-*.tar.gz farglassctl-linux-* farglass-client-* > SHA256SUMS
          cat SHA256SUMS
      # The same version and SHA-256 that farglassctl embeds
      # (COSIGN_VERSION and COSIGN_SHA256 in crates/farglassctl/src/release.rs).
      # sigstore/cosign-installer@v3 cannot install cosign v3: the release has no .sig file.
      - name: Install cosign
        env:
          COSIGN_VERSION: v3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: |
          set -eu
          curl -fsSL -o cosign "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
          echo "$COSIGN_SHA256  cosign" | sha256sum -c -
          chmod +x cosign
          ./cosign version
      - name: Sign SHA256SUMS (keyless)
        run: ./cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "farglass $VERSION" \
            --notes-file notes.md \
            dist/*
